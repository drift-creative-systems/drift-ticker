# On each published GitHub release: checks the version numbers agree, builds
# drift-ticker.zip from .distignore and attaches it to the release.
# Ticker isn't on WordPress.org, so there's no SVN deploy job. Install the zip
# on driftcreativesystems.co.uk by hand (Plugins → Add New → Upload).
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  SLUG: drift-ticker

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches plugin version
        run: |
          header=$(grep -m1 -E '^\s*\*\s*Version:' "$SLUG.php" | awk '{print $NF}')
          constant=$(sed -nE "s/.*define\( 'DRIFT_TICKER_VERSION', '([^']+)'.*/\1/p" "$SLUG.php" | head -1)
          stable=$(grep -m1 -E '^Stable tag:' readme.txt | awk '{print $NF}')
          tag="${TAG#v}"
          echo "Tag: $tag  Header: $header  Constant: $constant  Stable tag: $stable"
          if [ "$tag" != "$header" ] || [ "$tag" != "$constant" ] || [ "$tag" != "$stable" ]; then
            echo "::error::Release tag ($tag) must match the Version header, DRIFT_TICKER_VERSION and the readme.txt Stable tag."
            exit 1
          fi

      - name: Build zip
        run: |
          mkdir -p "build/$SLUG"
          rsync -a ./ "build/$SLUG/" --exclude-from=.distignore
          cd build && zip -rq "$SLUG.zip" "$SLUG"

      - name: Attach zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "build/$SLUG.zip" --clobber
